name: AVAIRA CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: |
          python -m pytest ../tests/test_backend_units.py -q

      - name: Notify Vercel check - backend-tests
        if: ${{ always() }}
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - avaira-v2: backend-tests

  deploy-frontend:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
    if: ${{ always() && needs.backend-tests.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy Full Stack To Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          # Deploy repository root so Vercel uses root vercel.json routes for both /api and SPA paths.
          working-directory: ./

      - name: Notify Vercel check - deploy-frontend
        if: ${{ always() }}
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - avaira-v2: deploy-frontend
